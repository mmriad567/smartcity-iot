<div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mt-6">

    <div class="flex items-start justify-between mb-4">
        <div>
            <h2 class="text-lg font-semibold mb-1">📈 শেষ ২৪ ঘণ্টা</h2>
            <p class="text-slate-400 text-sm">ট্যাংক ও মাটির আর্দ্রতার ট্রেন্ড</p>
        </div>
        <div class="flex gap-3 text-xs">
            <span class="flex items-center gap-1 text-slate-300">
                <span class="w-2 h-2 rounded-full bg-teal-400"></span>ট্যাংক
            </span>
            <span class="flex items-center gap-1 text-slate-300">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>মাটি
            </span>
        </div>
    </div>

    <div class="h-64 relative">
        <canvas id="history-chart"></canvas>
    </div>

</div>

<script>
(function() {
    if (window.smartcityChart) {
        try { window.smartcityChart.destroy(); } catch (e) {}
        window.smartcityChart = null;
    }

    const canvas = document.getElementById('history-chart');
    if (!canvas) return;

    const data = {{ chart_data|safe }};

    window.smartcityChart = new Chart(canvas, {
        type: 'line',
        data: {
            labels: data.labels,
            datasets: [
                {
                    label: 'পানি ট্যাংক %',
                    data: data.tank,
                    borderColor: '#14b8a6',
                    backgroundColor: 'rgba(20,184,166,0.15)',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 0,
                    borderWidth: 2,
                },
                {
                    label: 'মাটির আর্দ্রতা %',
                    data: data.soil,
                    borderColor: '#22c55e',
                    backgroundColor: 'rgba(34,197,94,0.15)',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 0,
                    borderWidth: 2,
                },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(15,23,42,0.95)',
                    borderColor: '#334155',
                    borderWidth: 1,
                },
            },
            scales: {
                x: {
                    ticks: { color: '#94a3b8', maxTicksLimit: 8, font: { size: 10 } },
                    grid: { color: 'rgba(148,163,184,0.08)' },
                },
                y: {
                    min: 0,
                    max: 100,
                    ticks: { color: '#94a3b8', font: { size: 10 } },
                    grid: { color: 'rgba(148,163,184,0.08)' },
                },
            },
        },
    });
})();
</script>
