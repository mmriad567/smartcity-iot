<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart City{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-400">🌆 Smart City IoT</h1>
            <span class="text-sm text-slate-400">Node: esp32-01</span>
        </div>
    </nav>

    <main class="flex-1 w-full">
        <div class="max-w-6xl mx-auto px-6 py-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="mt-auto text-center text-slate-500 text-sm py-4 border-t border-slate-800">
        Smart City Project · Django + HTMX + Tailwind
    </footer>

</body>
</html>
