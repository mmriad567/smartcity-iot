{% extends 'iot/base.html' %}

{% block title %}ড্যাশবোর্ড · Smart City{% endblock %}

{% block content %}

<!-- শীর্ষে শেষ আপডেট -->
{% if last_updated %}
<div class="flex justify-end mb-4">
    <span class="text-xs text-slate-500">
        শেষ আপডেট: {{ last_updated|timesince }} আগে
    </span>
</div>
{% endif %}

<!-- সেন্সর কার্ড — HTMX অটো রিফ্রেশ -->
<div id="sensor-cards"
     hx-get="{% url 'iot:sensor_cards' %}"
     hx-trigger="every 5s"
     hx-swap="innerHTML">
    {% include 'iot/partials/sensor_cards.html' %}
</div>

<!-- পাম্প প্যানেল — HTMX অটো রিফ্রেশ -->
<div id="pump-panel"
     hx-get="{% url 'iot:pump_panel' %}"
     hx-trigger="every 5s"
     hx-swap="innerHTML"
     class="mt-6">
    {% include 'iot/partials/pump_panel.html' %}
</div>

{% endblock %}
